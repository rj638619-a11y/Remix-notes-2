name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER_STR=$(java -version 2>&1 | head -n 1)
          if [[ "$JAVA_VER_STR" =~ version\ \"([0-9]+) ]]; then
            MAJOR_VER="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VER_STR" =~ ([0-9]+)\. ]]; then
            MAJOR_VER="${BASH_REMATCH[1]}"
          else
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi
          echo "Active Java Major Version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer, found $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi

          if [ -f ./debug.keystore ]; then
            echo "Confirmed ./debug.keystore exists."
          else
            echo "ERROR: ./debug.keystore could not be created or found."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APKs inside app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi

          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ] && [[ "$EXPECTED_APK" == *.apk ]] && [ "$EXPECTED_APK" = "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Verified $EXPECTED_APK exists, is a regular file, non-empty, has .apk extension, and matches exact path."
          else
            echo "ERROR: APK validation failed for $EXPECTED_APK"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | sed 's/[^a-zA-Z0-9._-]/_/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          echo "asset_path=${DEST_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_NAME" != *.apk ]]; then
            echo "::warning::Release asset validation failed. Skipping release creation."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_SHA="${{ github.sha }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${TARGET_SHA}

          Note: This APK is intended for testing. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$TARGET_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            RELEASE_INFO=$(gh release view "$TAG_NAME" --json url,title,tagName || true)
            if [ -n "$RELEASE_INFO" ]; then
              RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.url // empty')
              RELEASE_TITLE=$(echo "$RELEASE_INFO" | jq -r '.title // empty')
            fi

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: ${RELEASE_TITLE:-$TAG_NAME}"
            echo "Release URL: ${RELEASE_URL:-https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME}"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 GitHub Release Published Successfully" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK can be downloaded directly from the [GitHub Release Page](${RELEASE_URL:-https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME})." >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Name:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact:** The normal Actions artifact \`app-debug-apk\` is also available." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publishing failed or was skipped."
            echo "APK Build Succeeded."
            echo "The Actions artifact named app-debug-apk remains available."

            echo "### ⚠️ Release Publishing Notice" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded and the artifact \`app-debug-apk\` remains available in GitHub Actions." >> $GITHUB_STEP_SUMMARY
            echo "GitHub Release publishing did not complete." >> $GITHUB_STEP_SUMMARY
          fi
