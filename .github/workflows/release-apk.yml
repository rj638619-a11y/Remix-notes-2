name: Build and Release Production APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          version_str=$(java -version 2>&1 | head -n 1)
          echo "Full Java version string: $version_str"
          major_version=$(echo "$version_str" | sed -E 's/.*version "([0-9]+).*/\1/')
          echo "Detected Java Major Version: $major_version"
          if [[ ! "$major_version" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse Java major version from '$version_str'"
            exit 1
          fi
          if [ "$major_version" -lt 17 ]; then
            echo "Error: Java major version $major_version is lower than 17"
            exit 1
          fi
          echo "Java version verification passed. Version is 17 or newer ($major_version)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary release keystore
        run: |
          echo "Generating temporary production-quality release keystore..."
          keytool -genkey -v \
            -keystore release.keystore \
            -storepass release123 \
            -alias release-key \
            -keypass release123 \
            -dname "CN=Release Signing,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          if [ -f "release.keystore" ]; then
            echo "Verification Success: release.keystore exists."
            echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=release123" >> $GITHUB_ENV
            echo "KEY_ALIAS=release-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=release123" >> $GITHUB_ENV
          else
            echo "Error: release.keystore was not created successfully."
            exit 1
          fi

      - name: Build the release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk_path" ]; then
            echo "Expected release APK is missing!"
            echo "Searching in app/build/outputs/apk/release..."
            if [ -d "app/build/outputs/apk/release" ]; then
              find app/build/outputs/apk/release -name "*.apk"
            else
              echo "Directory app/build/outputs/apk/release does not exist!"
            fi
            exit 1
          fi
          if [ ! -f "$apk_path" ]; then
            echo "Error: $apk_path is not a regular file or does not exist."
            exit 1
          fi
          if [ ! -s "$apk_path" ]; then
            echo "Error: $apk_path is empty."
            exit 1
          fi
          if [[ "$apk_path" != *.apk ]]; then
            echo "Error: $apk_path does not have .apk extension."
            exit 1
          fi
          echo "APK verification successful: $apk_path exists, is a regular file, is not empty, and has .apk extension."

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          repo_full="${{ github.repository }}"
          repo_name="${repo_full#*/}"
          sanitized_repo=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]//g')
          filename="${sanitized_repo}-release-${{ github.run_number }}.apk"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release-assets/$filename"
          echo "asset_path=$RUNNER_TEMP/release-assets/$filename" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          asset_path="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$asset_path" ]; then
            echo "Error: Prepared release asset does not exist at $asset_path"
            exit 1
          fi
          if [[ "$asset_path" != *.apk ]]; then
            echo "Error: Prepared release asset is not an APK file"
            exit 1
          fi
          if [ ! -s "$asset_path" ]; then
            echo "Error: Prepared release asset is empty"
            exit 1
          fi
          echo "GitHub CLI is available and asset is verified. Creating release..."
          
          notes_file="$RUNNER_TEMP/release_notes.txt"
          cat <<EOF > "$notes_file"
          This is an automatically generated optimized production-quality release APK.
          The APK was built by GitHub Actions and undergoes code optimization (minification and resource shrinking).
          GitHub Actions Run Number: \${{ github.run_number }}
          GitHub Actions Run Attempt: \${{ github.run_attempt }}
          Source Commit SHA: \${{ github.sha }}
          The APK is fully signed with a temporary production-quality release keystore.
          EOF
          
          gh release create "release-${{ github.run_number }}-${{ github.run_attempt }}" \
            --title "Release APK #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes-file "$notes_file" \
            --latest \
            "$asset_path"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            tag="release-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$tag"
            release_url="https://github.com/${{ github.repository }}/releases/tag/$tag"
            asset_name=$(basename "${{ steps.prep_asset.outputs.asset_path }}")
            echo "Release Tag: $tag"
            echo "Release Title: Release APK #${{ github.run_number }}"
            echo "Release URL: $release_url"
            echo "Asset Filename: $asset_name"
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
### 🎉 Release APK Build & Publish Succeeded!

**Release Page:** [$release_url]($release_url)

- **Release Tag:** \`$tag\`
- **Release Title:** \`Release APK #${{ github.run_number }}\`
- **Direct Download:** You can download the optimized release APK directly from the **Assets** section of the release page: **$asset_name**
- **Backup Artifact:** The normal GitHub Actions workflow artifact named **release-apk** is also available as a backup.
EOF
          else
            echo "Warning: Release publishing failed."
            echo "The APK build and upload to GitHub Actions artifacts were successful."
            echo "The artifact named 'release-apk' remains available."
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
### ⚠️ Release APK Build Succeeded (Release Publishing Failed)

- **APK Build & Artifact Upload:** SUCCESS
- **Release Publishing Status:** FAILED / WARNING
- **Backup Availability:** The optimized release APK was successfully uploaded as a standard GitHub Actions artifact named **release-apk** and remains fully available for download.
EOF
          fi
